    <!-- UI Scripts -->
    <script>
        function openTab(tabId) {
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => content.classList.remove('active'));
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(button => button.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            const activeButtons = document.querySelectorAll(`button[onclick="openTab('${tabId}')"]`);
            activeButtons.forEach(btn => btn.classList.add('active'));
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        function switchFeed(feedType) {
            document.getElementById('btn-joined-feed').classList.remove('active');
            document.getElementById('btn-public-feed').classList.remove('active');
            document.getElementById('btn-' + feedType + '-feed').classList.add('active');
            
            // Logic to fetch from database goes here later
            document.getElementById('community-feed-display').innerHTML = '<p style="text-align: center; color: #777;">Loading ' + feedType + ' posts...</p>';
        }
    </script>
